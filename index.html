<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-wallet"></i> Expense Tracker</h1>
            <p>Keep track of your finances effortlessly</p>
        </header>

        <!-- Balance Summary Cards -->
        <section class="summary-cards">
            <div class="card balance-card">
                <h3>Total Balance</h3>
                <h2 id="total-balance">$0.00</h2>
            </div>
            <div class="card income-card">
                <h3>Total Income</h3>
                <h2 id="total-income">$0.00</h2>
            </div>
            <div class="card expense-card">
                <h3>Total Expense</h3>
                <h2 id="total-expense">$0.00</h2>
            </div>
        </section>

        <!-- Main Content Grid -->
        <div class="main-grid">
            <!-- Add Transaction Form -->
            <section class="form-section">
                <h2>Add New Transaction</h2>
                <form id="transaction-form">
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="e.g., Grocery, Salary, Rent" required>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount ($)</label>
                        <input type="number" id="amount" step="0.01" placeholder="e.g., 50.00 (or -50 for expense)" required>
                        <small>Use positive for income, negative for expense (or select type below)</small>
                    </div>

                    <div class="form-group">
                        <label for="type">Type</label>
                        <select id="type">
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category">
                            <option value="General">General</option>
                            <option value="Food">Food & Dining</option>
                            <option value="Bills">Bills & Utilities</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Salary">Salary & Work</option>
                            <option value="Shopping">Shopping</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-submit">Add Transaction</button>
                </form>
            </section>

            <!-- Transactions History -->
            <section class="history-section">
                <div class="history-header">
                    <h2>Transaction History</h2>
                    <div class="filter-group">
                        <input type="text" id="search-input" placeholder="Search transactions...">
                        <select id="filter-category">
                            <option value="all">All Categories</option>
                            <option value="Food">Food & Dining</option>
                            <option value="Bills">Bills & Utilities</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Salary">Salary & Work</option>
                            <option value="Shopping">Shopping</option>
                            <option value="General">General</option>
                        </select>
                    </div>
                </div>

                <div class="table-container">
                    <table id="transaction-table">
                        <thead>
                            <tr>
                                <th>Description</th>
                                <th>Category</th>
                                <th>Amount</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="transaction-list">
                            <!-- Dynamic rows will go here -->
                        </tbody>
                    </table>
                    <p id="no-transactions" class="hidden">No transactions found.</p>
                </div>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
